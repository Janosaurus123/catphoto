<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyPrint X6H Cam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 1.4rem; margin-bottom: 5px; }
        #status {
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 15px;
            padding: 8px 12px;
            background: #e2e2e8;
            border-radius: 8px;
            display: inline-block;
            max-width: 90%;
            word-break: break-all;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 384px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas { display: none; }
        button {
            width: 100%;
            max-width: 384px;
            background: #ff6b81;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(255,107,129,0.3);
        }
        button#btBtn { background: #4a90e2; box-shadow: 0 4px 6px rgba(74,144,226,0.3); }
        button:disabled { background: #ccc; box-shadow: none; }
    </style>
</head>
<body>

    <h1>TinyPrint X6H Cam 🐱</h1>
    <div id="status">Status: Disconnected</div>
    <br>

    <button id="btBtn" onclick="connectPrinter()">Scan & Connect Printer</button>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <button id="printBtn" onclick="snapAndPrint()" disabled>Snap & Print Photo</button>
    <canvas id="canvas"></canvas>

    <script>
        let bluetoothDevice;
        let pCharacteristic;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 384 } } 
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                document.getElementById('status').innerText = "Camera access denied.";
            }
        }
        initCamera();

        async function connectPrinter() {
            try {
                document.getElementById('status').innerText = "Scanning for X6H printer...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ae30-0000-1000-8000-00805f9b34fb', // X6H Custom BLE Service UUID
                        '0000ff00-0000-1000-8000-00805f9b34fb'  // Generic fallback
                    ]
                });

                document.getElementById('status').innerText = "Connecting to device...";
                const server = await bluetoothDevice.gatt.connect();
                
                const service = await server.getPrimaryService('0000ae30-0000-1000-8000-00805f9b34fb').catch(async () => {
                    const services = await server.getPrimaryServices();
                    return services[0];
                });

                const characteristics = await service.getCharacteristics();
                for (const char of characteristics) {
                    if (char.uuid.includes('ae01') || char.properties.write || char.properties.writeWithoutResponse) {
                        pCharacteristic = char;
                        break;
                    }
                }

                if (pCharacteristic) {
                    document.getElementById('status').innerText = "Connected! Ready ✅";
                    document.getElementById('printBtn').disabled = false;
                    document.getElementById('btBtn').innerText = "Connected ✅";
                } else {
                    document.getElementById('status').innerText = "No writable characteristic found.";
                }

            } catch (err) {
                document.getElementById('status').innerText = "Connection error: " + err.message;
            }
        }

        // Exact X6H Protocol Packet Constructor with Checksum & 0xFF trailer
        function buildX6HPacket(cmd, payloadArray) {
            let len = payloadArray.length;
            let packet = [
                0x51, 0x78,             // Magic Header bytes
                cmd,                    // Command byte
                0x00,                   // Direction node flag
                len & 0xFF,             // Payload Length (Low Byte)
                (len >> 8) & 0xFF       // Payload Length (High Byte)
            ];
            
            packet.push(...payloadArray);
            
            let checksum = 0;
            for (let b of payloadArray) checksum ^= b;
            packet.push(checksum);      // CRC8 Checksum
            packet.push(0xFF);          // Protocol Trailer byte
            
            return new Uint8Array(packet);
        }

        async function snapAndPrint() {
            if (!pCharacteristic) return;
            
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            const targetWidth = 384; 
            const scale = targetWidth / video.videoWidth;
            const targetHeight = Math.floor(video.videoHeight * scale);

            canvas.width = targetWidth;
            canvas.height = targetHeight;
            ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
            
            const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imgData.data;

            document.getElementById('status').innerText = "Processing image scanlines...";

            let bytesPerLine = Math.ceil(targetWidth / 8); // 48 bytes per line
            let scanlines = [];

            for (let y = 0; y < targetHeight; y++) {
                let rowBytes = new Uint8Array(bytesPerLine);
                for (let xByte = 0; xByte < bytesPerLine; xByte++) {
                    let byte = 0;
                    for (let bit = 0; bit < 8; bit++) {
                        let pxX = xByte * 8 + bit;
                        if (pxX < targetWidth) {
                            let offset = (y * targetWidth + pxX) * 4;
                            let gray = 0.299 * data[offset] + 0.587 * data[offset + 1] + 0.114 * data[offset + 2];
                            // Black dot if darker than threshold 135
                            if (gray < 135) {
                                byte |= (1 << (7 - bit)); // MSB-first orientation
                            }
                        }
                    }
                    rowBytes[xByte] = byte;
                }
                scanlines.push(rowBytes);
            }

            try {
                document.getElementById('status').innerText = "Waking up print head...";
                
                // 1. Send X6H hardware wake-up / handshake sequence
                await pCharacteristic.writeValue(buildX6HPacket(0xAE, [0x01, 0x01]));
                await new Promise(r => setTimeout(r, 50));

                // 2. Print Quality Setup (0xA4)
                await pCharacteristic.writeValue(buildX6HPacket(0xA4, [0x35]));
                await new Promise(r => setTimeout(r, 40));
                
                // 3. Darkness / Thermal Energy Configuration (0xAF)
                await pCharacteristic.writeValue(buildX6HPacket(0xAF, [0x00, 0xA0]));
                await new Promise(r => setTimeout(r, 40));
                
                // 4. Begin Print State (0xBE)
                await pCharacteristic.writeValue(buildX6HPacket(0xBE, [0x00]));
                await new Promise(r => setTimeout(r, 60));

                document.getElementById('status').innerText = `Printing ${scanlines.length} lines...`;

                // 5. Stream raw scanline packets using command 0xA2
                for (let i = 0; i < scanlines.length; i++) {
                    let packet = buildX6HPacket(0xA2, Array.from(scanlines[i]));
                    
                    if (pCharacteristic.properties.writeWithoutResponse) {
                        await pCharacteristic.writeValueWithoutResponse(packet);
                    } else {
                        await pCharacteristic.writeValue(packet);
                    }

                    // Pacing delay to match hardware buffer limits
                    await new Promise(r => setTimeout(r, 12));

                    if (i % 40 === 0) {
                        document.getElementById('status').innerText = `Printing line ${i}/${targetHeight}...`;
                    }
                }

                // 6. Final feed paper & cut instruction packet (0xBD)
                document.getElementById('status').innerText = "Feeding paper...";
                await new Promise(r => setTimeout(r, 100));
                await pCharacteristic.writeValue(buildX6HPacket(0xBD, [0x80, 0x02]));

                document.getElementById('status').innerText = "Print complete! 🎉";
            } catch (err) {
                document.getElementById('status').innerText = "Print error: " + err.message;
            }
        }
    </script>
</body>
</html>
