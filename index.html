<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Cam Printer</title>
<style>
  :root{--bg:#1e2227;--panel:#2a3037;--ink:#f2f4f6;--mute:#9aa4af;--hot:#ff4f8b;--ok:#5ad19a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
  video,canvas#shot{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
  canvas#shot{display:none;background:#fff;image-rendering:pixelated}
  #status{padding:10px 16px;font-size:14px;color:var(--mute);min-height:40px;background:var(--panel)}
  #status.ok{color:var(--ok)} #status.err{color:var(--hot)}
  #bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px 18px;background:var(--panel)}
  button{font:inherit;color:var(--ink);background:#3a424b;border:0;border-radius:14px;padding:14px 16px;min-width:76px}
  button:disabled{opacity:.4}
  button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
  #snap{width:76px;height:76px;min-width:0;border-radius:50%;background:var(--ink);border:6px solid #3a424b;padding:0}
  #print{background:var(--hot);color:#fff;font-weight:600}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="shot"></canvas>
</div>
<div id="status">Tap Connect to pair your cat printer.</div>
<div id="bar">
  <button id="conn">Connect</button>
  <button id="snap" aria-label="Take photo"></button>
  <button id="flip">Flip</button>
  <button id="retake" class="hide">Retake</button>
  <button id="print" class="hide" disabled>Print</button>
</div>

<script>
const $ = id => document.getElementById(id);
const cam = $('cam'), shot = $('shot'), statusEl = $('status');
const PRINT_W = 384;               // dots per line (48 bytes) on most cat printers
const SERVICE = 0xAE30, CHAR = 0xAE01;
let facing = 'environment', stream = null, device = null, writeChar = null, bitmap = null;

function say(msg, cls=''){ statusEl.textContent = msg; statusEl.className = cls; }

/* ---------- Camera ---------- */
async function startCam(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280}},audio:false});
    cam.srcObject = stream;
  }catch(e){ say('Camera blocked: allow camera access for this site in browser settings.','err'); }
}

$('flip').onclick = () => { facing = facing==='environment' ? 'user' : 'environment'; startCam(); };

$('snap').onclick = () => {
  const vw = cam.videoWidth, vh = cam.videoHeight;
  if(!vw){ say('Camera is not ready yet.','err'); return; }
  const h = Math.round(PRINT_W * vh / vw);
  const c = document.createElement('canvas'); c.width = PRINT_W; c.height = h;
  const x = c.getContext('2d'); x.drawImage(cam,0,0,PRINT_W,h);
  bitmap = dither(x.getImageData(0,0,PRINT_W,h));
  shot.width = PRINT_W; shot.height = h;
  shot.getContext('2d').putImageData(toImage(bitmap,h),0,0);
  cam.style.display='none'; shot.style.display='block';
  $('snap').classList.add('hide'); $('flip').classList.add('hide');
  $('retake').classList.remove('hide'); $('print').classList.remove('hide');
  $('print').disabled = !writeChar;
  say(writeChar ? 'Ready to print.' : 'Connect a printer to print.');
};

$('retake').onclick = () => {
  bitmap = null; shot.style.display='none'; cam.style.display='block';
  $('snap').classList.remove('hide'); $('flip').classList.remove('hide');
  $('retake').classList.add('hide'); $('print').classList.add('hide');
  say(writeChar ? 'Printer connected.' : 'Tap Connect to pair your cat printer.', writeChar?'ok':'');
};

/* ---------- Image to 1-bit (Floyd-Steinberg with auto-contrast) ---------- */
function dither(img){
  const w = img.width, h = img.height, g = new Float32Array(w*h);
  let lo = 255, hi = 0;
  for(let i=0;i<w*h;i++){
    const v = 0.299*img.data[i*4] + 0.587*img.data[i*4+1] + 0.114*img.data[i*4+2];
    g[i] = v; if(v<lo) lo=v; if(v>hi) hi=v;
  }
  const span = Math.max(hi-lo,1);
  for(let i=0;i<g.length;i++) g[i] = (g[i]-lo)/span*255;
  const out = new Uint8Array(w*h); // 1 = black
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i = y*w+x, old = g[i], nw = old<128 ? 0 : 255, err = old-nw;
    out[i] = nw===0 ? 1 : 0;
    if(x+1<w) g[i+1] += err*7/16;
    if(y+1<h){
      if(x>0) g[i+w-1] += err*3/16;
      g[i+w] += err*5/16;
      if(x+1<w) g[i+w+1] += err*1/16;
    }
  }
  return out;
}
function toImage(bits,h){
  const d = new ImageData(PRINT_W,h);
  for(let i=0;i<bits.length;i++){ const v = bits[i]?0:255; d.data.set([v,v,v,255],i*4); }
  return d;
}

/* ---------- Cat printer protocol ---------- */
function crc8(data){
  let c = 0;
  for(const b of data){ c ^= b; for(let i=0;i<8;i++) c = (c & 0x80) ? ((c<<1)^0x07)&0xFF : (c<<1)&0xFF; }
  return c;
}
function packet(cmd, data){
  data = Array.from(data);
  return [0x51,0x78,cmd,0x00,data.length&0xFF,data.length>>8,...data,crc8(data),0xFF];
}
function buildJob(bits,h){
  const out = [];
  const add = (cmd,data) => out.push(...packet(cmd,data));
  add(0xA3,[0x00]);                                            // device state
  add(0xA4,[0x32]);                                            // quality
  add(0xA6,[0xAA,0x55,0x17,0x38,0x44,0x5F,0x5F,0x5F,0x44,0x38,0x2C]); // lattice start
  add(0xAF,[0xE0,0x2E]);                                       // energy (darkness)
  add(0xBE,[0x00]);                                            // image mode
  add(0xBD,[0x20]);                                            // speed
  for(let y=0;y<h;y++){
    const row = new Array(PRINT_W/8).fill(0);
    for(let x=0;x<PRINT_W;x++) if(bits[y*PRINT_W+x]) row[x>>3] |= 1<<(x&7);  // LSB first
    add(0xA2,row);
  }
  add(0xA1,[0x60,0x00]);                                       // feed paper
  add(0xA6,[0xAA,0x55,0x17,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x17]); // lattice end
  add(0xA3,[0x00]);
  return Uint8Array.from(out);
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

const CANDIDATES = [[0xAE30,0xAE01],[0xAF30,0xAF31],[0x18F0,0x2AF1],[0xFF00,0xFF02],[0xFFE0,0xFFE1]];
const errText = e => (e && (e.message || e.name)) || String(e);

$('conn').onclick = async () => {
  if(!navigator.bluetooth){
    say('This browser has no Bluetooth. On iPhone, open this page in the Bluefy browser.','err'); return;
  }
  let step = 'choosing device';
  try{
    say('Choose your printer…');
    const full = n => '0000' + n.toString(16).padStart(4,'0') + '-0000-1000-8000-00805f9b34fb';
    const attempts = [
      {acceptAllDevices:true, optionalServices:[full(0xAE30), full(0xAF30), full(0x18F0)]},
      {acceptAllDevices:true, optionalServices:[full(0xAE30)]},
      {acceptAllDevices:true}
    ];
    let lastErr; device = null;
    for(const opts of attempts){
      try{ device = await navigator.bluetooth.requestDevice(opts); break; }
      catch(err){
        lastErr = err;
        if(err && err.name === 'NotFoundError') break;   // user cancelled or nothing found
      }
    }
    if(!device) throw new Error('picker failed (' + errText(lastErr) + '). Make sure the printer is on, nearby, and not connected to another app.');
    device.addEventListener('gattserverdisconnected',()=>{
      writeChar=null; $('print').disabled=true; $('conn').textContent='Connect'; say('Printer disconnected. Tap Connect.','err');
    });
    step = 'connecting to ' + (device.name||'device');
    say('Connecting to ' + (device.name||'device') + '…');
    const server = await device.gatt.connect();
    await sleep(500);
    step = 'finding print service';
    let found = null; await sleep(300);
    for(const [s,c] of CANDIDATES){
      try{
        const svc = await server.getPrimaryService(s);
        found = await svc.getCharacteristic(c);
        break;
      }catch(_){}
    }
    if(!found){
      // last resort: any writable characteristic on any allowed service
      for(const svc of await server.getPrimaryServices().catch(()=>[])){
        for(const ch of await svc.getCharacteristics().catch(()=>[])){
          if(ch.properties.writeWithoutResponse){ found = ch; break; }
        }
        if(found) break;
      }
    }
    if(!found) throw new Error('no writable printer service found on ' + (device.name||'this device') + ' (is it the printer?)');
    writeChar = found;
    $('conn').textContent = 'Connected';
    $('print').disabled = !bitmap;
    say('Connected to ' + (device.name||'printer') + '.','ok');
  }catch(e){ say('Failed while ' + step + ': ' + errText(e),'err'); }
};

$('print').onclick = async () => {
  if(!writeChar || !bitmap) return;
  $('print').disabled = true;
  try{
    const job = buildJob(bitmap, bitmap.length/PRINT_W);
    const CHUNK = 100;
    for(let i=0;i<job.length;i+=CHUNK){
      await writeChar.writeValueWithoutResponse(job.slice(i,i+CHUNK));
      await sleep(20);
      if(i % 4000 < CHUNK) say('Printing… ' + Math.round(i/job.length*100) + '%');
    }
    say('Printed.','ok');
  }catch(e){ say('Print failed: ' + e.message,'err'); }
  $('print').disabled = false;
};

startCam();
</script>
</body>
</html>
