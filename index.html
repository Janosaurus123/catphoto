<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Printer Official SDK Cam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 1.4rem; margin-bottom: 5px; }
        #status {
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 15px;
            padding: 8px 12px;
            background: #e2e2e8;
            border-radius: 8px;
            display: inline-block;
            max-width: 90%;
            word-break: break-all;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 384px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas { display: none; }
        button {
            width: 100%;
            max-width: 384px;
            background: #ff6b81;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(255,107,129,0.3);
        }
        button#btBtn { background: #4a90e2; box-shadow: 0 4px 6px rgba(74,144,226,0.3); }
        button:disabled { background: #ccc; box-shadow: none; }
    </style>
</head>
<body>

    <h1>Cat Printer SDK Cam 🐱</h1>
    <div id="status">Status: Disconnected</div>
    <br>

    <button id="btBtn" onclick="connectPrinter()">Connect via Official SDK</button>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <button id="printBtn" onclick="snapAndPrint()" disabled>Snap & Print Photo</button>
    <canvas id="canvas"></canvas>

    <script type="module">
        // Import the official opuu/cat-printer library directly via CDN
        import { CatPrinter } from 'https://cdn.jsdelivr.net/npm/@opuu/cat-printer/+esm';

        let printer = new CatPrinter();

        // 1. Initialize Camera Feed
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 384 } } 
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                document.getElementById('status').innerText = "Camera access denied.";
            }
        }
        initCamera();

        // 2. Connect using the library's built-in device discovery
        window.connectPrinter = async function() {
            try {
                document.getElementById('status').innerText = "Requesting Bluetooth Device (SDK)...";
                await printer.connect();
                
                document.getElementById('status').innerText = "Connected! Ready to print ✅";
                document.getElementById('printBtn').disabled = false;
                document.getElementById('btBtn').innerText = "Connected ✅";
            } catch (err) {
                document.getElementById('status').innerText = "Connection error: " + err.message;
            }
        };

        // 3. Capture frame and use SDK's native image processor & print pipeline
        window.snapAndPrint = async function() {
            if (!printer.isConnected()) return;
            
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            const targetWidth = 384; 
            const scale = targetWidth / video.videoWidth;
            const targetHeight = Math.floor(video.videoHeight * scale);

            canvas.width = targetWidth;
            canvas.height = targetHeight;
            ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
            
            // Convert canvas stream into image URL for the SDK
            const imageUrl = canvas.toDataURL('image/png');

            try {
                document.getElementById('status').innerText = "Processing & printing via official SDK...";
                
                // Configure print speed & thermal energy density using SDK parameters
                await printer.prepare(32, 28000);
                
                // Send image through built-in dithering filter
                await printer.printImage(imageUrl, { dither: 'threshold' });
                
                // Feed paper out of cutter slot
                await printer.feed(60);

                document.getElementById('status').innerText = "Print complete! 🎉";
            } catch (err) {
                document.getElementById('status').innerText = "Print error: " + err.message;
            }
        };
    </script>
</body>
</html>
