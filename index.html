<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Camera</title>
<style>
  :root{--glass:rgba(60,60,67,.42);--glass-line:rgba(255,255,255,.18);--yellow:#ffd60a;--blue:#0a84ff;--green:#30d158;--red:#ff453a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-line),0 4px 18px rgba(0,0,0,.25)}
  button{font:inherit;color:#fff;border:0;background:none;padding:0;cursor:pointer}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  svg{display:block}

  #top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative;z-index:2}
  .round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
  #toast{position:absolute;left:50%;top:8px;transform:translate(-50%,-8px);max-width:60%;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{color:var(--red)} #toast.ok{color:var(--green)}

  #finder{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;margin:0 6px;background:#111}
  video,#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #shot{display:none;object-fit:contain;background:#fff;image-rendering:pixelated}
  #mode{text-align:center;height:44px;line-height:44px;font-size:14px;font-weight:600;color:var(--yellow);letter-spacing:.3px}

  #controls{height:112px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
  #thumb{width:56px;height:56px;border-radius:12px;background:#222 center/cover;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
  #snap{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
  #snap i{width:64px;height:64px;border-radius:50%;background:#fff;transition:transform .12s}
  #snap:active i{transform:scale(.88)}
  #preview-bar{display:none;align-items:center;justify-content:space-between;width:100%}
  .pill{height:50px;padding:0 26px;border-radius:25px;font-size:17px;font-weight:600}
  .pill.main{background:var(--yellow);color:#000}
  .pill:disabled{opacity:.45}
  body.review #controls .cam{display:none} body.review #preview-bar{display:flex} body.review #mode{visibility:hidden}

  /* Settings sheet */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s;z-index:5}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);background:rgba(36,36,40,.78)}
  body.sheet #scrim{opacity:1;pointer-events:auto} body.sheet #sheet{transform:none}
  #grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:0 auto 14px}
  #sheet h2{margin:0 0 14px;font-size:20px;font-weight:700;text-align:center}
  .group{background:rgba(120,120,128,.24);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:54px;gap:12px}
  .row+.row{box-shadow:inset 0 .5px 0 rgba(255,255,255,.14)}
  .row small{display:block;color:#9b9ba1;font-size:13px;margin-top:2px}
  #conn{background:var(--blue);border-radius:16px;padding:8px 16px;font-weight:600;font-size:15px}
  #conn.on{background:rgba(48,209,88,.25);color:var(--green)}
  .switch{position:relative;width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.5);transition:.25s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.25s}
  .switch[aria-checked=true]{background:var(--green)} .switch[aria-checked=true]::after{transform:translateX(20px)}
  #done{width:100%;height:50px;border-radius:14px;background:var(--blue);font-weight:600;font-size:17px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="top">
  <button class="round glass" id="gear" aria-label="Settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <div id="toast" class="glass" role="status"></div>
  <div class="round" style="visibility:hidden"></div>
</div>

<div id="finder">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="shot"></canvas>
</div>
<div id="mode">PRINT</div>

<div id="controls">
  <button id="thumb" class="cam" aria-label="Last photo"></button>
  <button id="snap" class="cam" aria-label="Take photo"><i></i></button>
  <button id="flip" class="round glass cam" aria-label="Flip camera">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-1.5-2h-7L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9.5 13a2.7 2.7 0 0 1 4.6-1.8M14.5 13a2.7 2.7 0 0 1-4.6 1.8"/></svg>
  </button>
  <div id="preview-bar">
    <button class="pill glass" id="retake">Retake</button>
    <button class="pill main" id="print">Print</button>
  </div>
</div>

<div id="scrim"></div>
<div id="sheet" class="glass" role="dialog" aria-label="Settings">
  <div id="grab"></div>
  <h2>Settings</h2>
  <div class="group">
    <div class="row">
      <div>Printer<small id="pstate">Not connected</small></div>
      <button id="conn">Connect</button>
    </div>
    <div class="row">
      <div>Auto print<small>Print right after each photo</small></div>
      <button class="switch" id="auto" role="switch" aria-checked="false" aria-label="Auto print"></button>
    </div>
  </div>
  <button id="done">Done</button>
</div>

<script>
const $ = id => document.getElementById(id);
const cam = $('cam'), shot = $('shot');
const PRINT_W = 384, SERVICE = 0xAE30, CHAR = 0xAE01;
let facing = 'environment', stream = null, device = null, writeChar = null, bitmap = null, autoPrint = false, busy = false;

try{ autoPrint = localStorage.getItem('autoPrint') === '1'; }catch(_){}
$('auto').setAttribute('aria-checked', autoPrint);

/* ---------- UI helpers ---------- */
let tt;
function say(msg, cls=''){
  const t = $('toast'); t.textContent = msg; t.className = 'glass show ' + cls;
  clearTimeout(tt); if(cls !== 'err' || true) tt = setTimeout(()=>t.classList.remove('show'), cls==='err'?6000:3000);
}
const sheet = open => document.body.classList.toggle('sheet', open);
$('gear').onclick = () => sheet(true);
$('done').onclick = $('scrim').onclick = () => sheet(false);
$('auto').onclick = () => {
  autoPrint = !autoPrint; $('auto').setAttribute('aria-checked', autoPrint);
  try{ localStorage.setItem('autoPrint', autoPrint ? '1' : '0'); }catch(_){}
};
function setConn(on, name){
  $('conn').textContent = on ? 'Disconnect' : 'Connect';
  $('conn').classList.toggle('on', on);
  $('pstate').textContent = on ? 'Connected to ' + (name||'printer') : 'Not connected';
  $('print').disabled = !on && false;
}

/* ---------- Camera ---------- */
async function startCam(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280}},audio:false});
    cam.srcObject = stream;
  }catch(e){ say('Allow camera access in browser settings','err'); }
}
$('flip').onclick = () => { facing = facing==='environment' ? 'user' : 'environment'; startCam(); };

$('snap').onclick = async () => {
  const vw = cam.videoWidth, vh = cam.videoHeight;
  if(!vw){ say('Camera is not ready yet','err'); return; }
  const h = Math.round(PRINT_W * vh / vw);
  const c = document.createElement('canvas'); c.width = PRINT_W; c.height = h;
  const x = c.getContext('2d'); x.drawImage(cam,0,0,PRINT_W,h);
  bitmap = dither(x.getImageData(0,0,PRINT_W,h));
  shot.width = PRINT_W; shot.height = h;
  shot.getContext('2d').putImageData(toImage(bitmap,h),0,0);
  $('thumb').style.backgroundImage = 'url(' + shot.toDataURL() + ')';
  shot.style.display = 'block'; document.body.classList.add('review');
  if(autoPrint){
    if(writeChar) await printNow();
    else { say('Connect a printer in Settings','err'); }
  }
};
function backToCamera(){
  bitmap = null; shot.style.display = 'none'; document.body.classList.remove('review');
}
$('retake').onclick = backToCamera;

/* ---------- Image to 1-bit (Floyd-Steinberg, auto-contrast) ---------- */
function dither(img){
  const w = img.width, h = img.height, g = new Float32Array(w*h);
  let lo = 255, hi = 0;
  for(let i=0;i<w*h;i++){
    const v = 0.299*img.data[i*4] + 0.587*img.data[i*4+1] + 0.114*img.data[i*4+2];
    g[i] = v; if(v<lo) lo=v; if(v>hi) hi=v;
  }
  const span = Math.max(hi-lo,1);
  for(let i=0;i<g.length;i++) g[i] = (g[i]-lo)/span*255;
  const out = new Uint8Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i = y*w+x, old = g[i], nw = old<128 ? 0 : 255, err = old-nw;
    out[i] = nw===0 ? 1 : 0;
    if(x+1<w) g[i+1] += err*7/16;
    if(y+1<h){
      if(x>0) g[i+w-1] += err*3/16;
      g[i+w] += err*5/16;
      if(x+1<w) g[i+w+1] += err*1/16;
    }
  }
  return out;
}
function toImage(bits,h){
  const d = new ImageData(PRINT_W,h);
  for(let i=0;i<bits.length;i++){ const v = bits[i]?0:255; d.data.set([v,v,v,255],i*4); }
  return d;
}

/* ---------- Cat printer protocol ---------- */
function crc8(data){
  let c = 0;
  for(const b of data){ c ^= b; for(let i=0;i<8;i++) c = (c & 0x80) ? ((c<<1)^0x07)&0xFF : (c<<1)&0xFF; }
  return c;
}
function packet(cmd, data){
  data = Array.from(data);
  return [0x51,0x78,cmd,0x00,data.length&0xFF,data.length>>8,...data,crc8(data),0xFF];
}
function buildJob(bits,h){
  const out = [];
  const add = (cmd,data) => out.push(...packet(cmd,data));
  add(0xA3,[0x00]);
  add(0xA4,[0x32]);
  add(0xA6,[0xAA,0x55,0x17,0x38,0x44,0x5F,0x5F,0x5F,0x44,0x38,0x2C]);
  add(0xAF,[0xE0,0x2E]);   // energy: raise for darker prints
  add(0xBE,[0x00]);
  add(0xBD,[0x20]);
  for(let y=0;y<h;y++){
    const row = new Array(PRINT_W/8).fill(0);
    for(let x=0;x<PRINT_W;x++) if(bits[y*PRINT_W+x]) row[x>>3] |= 1<<(x&7);
    add(0xA2,row);
  }
  add(0xA1,[0x60,0x00]);
  add(0xA6,[0xAA,0x55,0x17,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x17]);
  add(0xA3,[0x00]);
  return Uint8Array.from(out);
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const errText = e => (e && (e.message || e.name)) || String(e);

async function printNow(){
  if(busy || !bitmap) return;
  if(!writeChar){ say('Connect a printer in Settings','err'); return; }
  busy = true; $('print').disabled = true;
  try{
    const job = buildJob(bitmap, bitmap.length/PRINT_W), CHUNK = 100;
    for(let i=0;i<job.length;i+=CHUNK){
      await writeChar.writeValueWithoutResponse(job.slice(i,i+CHUNK));
      await sleep(20);
      if(i % 4000 < CHUNK) say('Printing… ' + Math.round(i/job.length*100) + '%');
    }
    say('Printed','ok');
    if(autoPrint) setTimeout(backToCamera, 700);
  }catch(e){ say('Print failed: ' + errText(e),'err'); }
  busy = false; $('print').disabled = false;
}
$('print').onclick = printNow;

/* ---------- Bluetooth connect (in Settings) ---------- */
const CANDIDATES = [[0xAE30,0xAE01],[0xAF30,0xAF31],[0x18F0,0x2AF1],[0xFF00,0xFF02],[0xFFE0,0xFFE1]];
const full = n => '0000' + n.toString(16).padStart(4,'0') + '-0000-1000-8000-00805f9b34fb';

$('conn').onclick = async () => {
  if(writeChar && device){ device.gatt.disconnect(); return; }
  if(!navigator.bluetooth){ say('No Bluetooth here. On iPhone, open this page in Bluefy','err'); return; }
  let step = 'choosing device';
  try{
    device = null; let lastErr;
    const attempts = [
      {acceptAllDevices:true, optionalServices:[full(0xAE30), full(0xAF30), full(0x18F0)]},
      {acceptAllDevices:true, optionalServices:[full(0xAE30)]},
      {acceptAllDevices:true}
    ];
    for(const opts of attempts){
      try{ device = await navigator.bluetooth.requestDevice(opts); break; }
      catch(err){ lastErr = err; if(err && err.name === 'NotFoundError') break; }
    }
    if(!device) throw new Error('picker failed (' + errText(lastErr) + '). Is the printer on and free of other apps?');
    device.addEventListener('gattserverdisconnected',()=>{ writeChar = null; setConn(false); say('Printer disconnected','err'); });
    step = 'connecting';
    $('pstate').textContent = 'Connecting…';
    const server = await device.gatt.connect();
    await sleep(500);
    step = 'finding print service';
    let found = null;
    for(const [s,c] of CANDIDATES){
      try{ found = await (await server.getPrimaryService(s)).getCharacteristic(c); break; }catch(_){}
    }
    if(!found){
      for(const svc of await server.getPrimaryServices().catch(()=>[])){
        for(const ch of await svc.getCharacteristics().catch(()=>[])){
          if(ch.properties.writeWithoutResponse){ found = ch; break; }
        }
        if(found) break;
      }
    }
    if(!found) throw new Error('no print service on ' + (device.name||'this device'));
    writeChar = found; setConn(true, device.name);
    say('Printer connected','ok');
  }catch(e){ setConn(false); say('Failed while ' + step + ': ' + errText(e),'err'); }
};

startCam();
</script>
</body>
</html>
