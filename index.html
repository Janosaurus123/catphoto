<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Printer Web SDK Cam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 1.4rem; margin-bottom: 5px; }
        #status {
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 15px;
            padding: 8px 12px;
            background: #e2e2e8;
            border-radius: 8px;
            display: inline-block;
            max-width: 90%;
            word-break: break-all;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 384px;
            margin: 0 auto 15px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas { display: none; }
        button {
            width: 100%;
            max-width: 384px;
            background: #ff6b81;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(255,107,129,0.3);
        }
        button#btBtn { background: #4a90e2; box-shadow: 0 4px 6px rgba(74,144,226,0.3); }
        button:disabled { background: #ccc; box-shadow: none; }
    </style>
</head>
<body>

    <h1>Cat Printer SDK Cam 🐱</h1>
    <div id="status">Status: Disconnected</div>
    <br>

    <button id="btBtn" onclick="connectPrinter()">Connect Cat Printer</button>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <button id="printBtn" onclick="snapAndPrint()" disabled>Snap & Print Photo</button>
    <canvas id="canvas"></canvas>

    <script>
        let bluetoothDevice;
        let pCharacteristic;

        // 1. Start Live Camera Preview
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 384 } } 
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                document.getElementById('status').innerText = "Camera access denied.";
            }
        }
        initCamera();

        // 2. Connect using broad SDK service discovery (handles X6H and standard cat printers)
        async function connectPrinter() {
            try {
                document.getElementById('status').innerText = "Requesting Bluetooth Device...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ff00-0000-1000-8000-00805f9b34fb', 
                        '49535343-fe7d-4ae5-8fa9-9fafd205e455', 
                        '0000ae30-0000-1000-8000-00805f9b34fb'
                    ]
                });

                document.getElementById('status').innerText = `Connecting to ${bluetoothDevice.name || 'Printer'}...`;
                const server = await bluetoothDevice.gatt.connect();
                
                const services = await server.getPrimaryServices();
                for (const service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (const char of characteristics) {
                        if (char.properties.write || char.properties.writeWithoutResponse) {
                            pCharacteristic = char;
                            break;
                        }
                    }
                    if (pCharacteristic) break;
                }

                if (pCharacteristic) {
                    document.getElementById('status').innerText = "Connected! Ready to print ✅";
                    document.getElementById('printBtn').disabled = false;
                    document.getElementById('btBtn').innerText = "Connected ✅";
                } else {
                    document.getElementById('status').innerText = "Connected, but no writable channel found.";
                }

            } catch (err) {
                document.getElementById('status').innerText = "Connection error: " + err.message;
            }
        }

        // SDK Packet Builder Helper
        function createPacket(command, payload) {
            let pkt = [0x51, 0x78, command, 0x00];
            let len = payload.length;
            pkt.push(len & 0xFF, (len >> 8) & 0xFF);
            pkt.push(...payload);
            return new Uint8Array(pkt);
        }

        // 3. SDK-Style Image Capture and Printing Pipeline
        async function snapAndPrint() {
            if (!pCharacteristic) return;
            
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            const targetWidth = 384; // Standard thermal paper width
            const scale = targetWidth / video.videoWidth;
            const targetHeight = Math.floor(video.videoHeight * scale);

            canvas.width = targetWidth;
            canvas.height = targetHeight;
            ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
            
            const imgData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imgData.data;

            document.getElementById('status').innerText = "Processing image (Threshold Dithering)...";

            let bytesPerLine = Math.ceil(targetWidth / 8);
            let scanlines = [];

            // High-contrast conversion loop
            for (let y = 0; y < targetHeight; y++) {
                let rowBytes = new Uint8Array(bytesPerLine);
                for (let xByte = 0; xByte < bytesPerLine; xByte++) {
                    let byte = 0;
                    for (let bit = 0; bit < 8; bit++) {
                        let pxX = xByte * 8 + bit;
                        if (pxX < targetWidth) {
                            let offset = (y * targetWidth + pxX) * 4;
                            // Grayscale calculation with high contrast push
                            let r = data[offset];
                            let g = data[offset + 1];
                            let b = data[offset + 2];
                            let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                            
                            // If darker than threshold (140 for better contrast on camera shots), set bit
                            if (gray < 140) {
                                byte |= (1 << (7 - bit));
                            }
                        }
                    }
                    rowBytes[xByte] = byte;
                }
                scanlines.push(rowBytes);
            }

            try {
                document.getElementById('status').innerText = "Sending initialization...";
                
                // Initialize printer settings matching SDK config
                await pCharacteristic.writeValue(createPacket(0xA4, [0x35])); // Quality
                await new Promise(r => setTimeout(r, 40));
                await pCharacteristic.writeValue(createPacket(0xAF, [0x00, 0x70])); // Energy/Darkness
                await new Promise(r => setTimeout(r, 40));
                await pCharacteristic.writeValue(createPacket(0xBE, [0x00])); // Start print mode
                await new Promise(r => setTimeout(r, 60));

                document.getElementById('status').innerText = "Printing lines...";

                // Send data line-by-line using command 0xA2 with safe buffer pacing
                for (let i = 0; i < scanlines.length; i++) {
                    let packet = createPacket(0xA2, Array.from(scanlines[i]));
                    
                    if (pCharacteristic.properties.writeWithoutResponse) {
                        await pCharacteristic.writeValueWithoutResponse(packet);
                    } else {
                        await pCharacteristic.writeValue(packet);
                    }

                    // Pacing delay to avoid buffer overflow on hardware
                    await new Promise(r => setTimeout(r, 12));

                    if (i % 30 === 0) {
                        document.getElementById('status').innerText = `Printing line ${i}/${targetHeight}...`;
                    }
                }

                // Finish and feed paper out of the cutter slot
                await new Promise(r => setTimeout(r, 100));
                await pCharacteristic.writeValue(createPacket(0xBD, [0x50, 0x00]));

                document.getElementById('status').innerText = "Print complete! 🎉";
            } catch (err) {
                document.getElementById('status').innerText = "Print error: " + err.message;
            }
        }
    </script>
</body>
</html>
